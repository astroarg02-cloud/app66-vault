name: Generar APK de Android (Vite + Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android desde Vite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Instalar dependencias npm
        run: |
          npm install

      - name: 5. Compilar Frontend Web con Vite
        run: |
          npm run build

      - name: 6. Sincronizar plataforma Android con Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: 7. Aplicar configuración AMOLED #000000 y estilos nativos
        run: |
          node scripts/configure-android.cjs

      - name: 8. Compilar APK Nativa (Debug / Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Preparar archivo APK final
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Seis6_Vault_v1.0.apk
          echo "APK generada exitosamente en build-output/Seis6_Vault_v1.0.apk"
          ls -lh build-output/Seis6_Vault_v1.0.apk

      - name: 10. Subir APK lista para instalar en cualquier Android
        uses: actions/upload-artifact@v4
        with:
          name: Seis6-Vault-Vite-APK
          path: build-output/Seis6_Vault_v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: 11. Resumen de compilación
        run: |
          echo "### 🎉 ¡APK Compilada con Éxito desde Vite!" >> $GITHUB_STEP_SUMMARY
          echo "- **Motor:** Vite + React + Capacitor Nativo" >> $GITHUB_STEP_SUMMARY
          echo "- **Diseño:** 100% AMOLED Dark (#000000) Edge-to-Edge" >> $GITHUB_STEP_SUMMARY
          echo "- **Base de Datos:** Firebase Firestore + Cloud Sync" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivo:** \`Seis6_App_v1.0.apk\` disponible para descarga en Artifacts." >> $GITHUB_STEP_SUMMARY

