name: Generar APK Nativa de Android (Flutter)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17 (Oficial para Flutter Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Preparar plataforma Android Nativa y permisos
        working-directory: ./flutter_app
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart lib/main.dart.bak
          flutter create --platforms=android --org com.seis6 --project-name seis6_vault_native .
          mv pubspec.yaml.bak pubspec.yaml
          mv lib/main.dart.bak lib/main.dart
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"
          fi
          sed -i 's/android:label="[^"]*"/android:label="Seis6 Vault"/' "$MANIFEST"
          flutter pub get

      - name: 5. Compilar APK 100% Nativa en código máquina (Release)
        working-directory: ./flutter_app
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: 6. Subir APK Nativa lista para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Seis6-App-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
