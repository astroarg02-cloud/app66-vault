name: Generar APK de Android (Vite + Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android desde Vite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar dependencias npm
        run: |
          npm install --legacy-peer-deps

      - name: 6. Compilar Frontend Web con Vite
        run: |
          npm run build

      - name: 7. Sincronizar plataforma Android con Capacitor
        run: |
          if [ ! -d "android" ]; then
            echo "Directorio android no encontrado, agregando plataforma Android..."
            npx cap add android
          else
            echo "Directorio android encontrado, sincronizando assets..."
            npx cap sync android
          fi

      - name: 8. Aplicar configuración AMOLED #000000 y estilos nativos
        run: |
          node scripts/configure-android.cjs

      - name: 9. Aceptar licencias del SDK de Android
        run: |
          echo "Aceptando licencias del Android SDK..."
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/licenses" || true
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || true
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || true
            echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license" 2>/dev/null || true
          fi
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: 10. Compilar APK Nativa con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 11. Preparar archivo APK final
        run: |
          mkdir -p build-output
          APK_FOUND=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "ERROR: No se encontró ningún archivo APK generado por Gradle."
            exit 1
          fi
          echo "APK encontrada en: $APK_FOUND"
          cp "$APK_FOUND" build-output/Seis6_App_v1.0.apk
          cp "$APK_FOUND" build-output/Seis6_Vault_v1.0.apk
          echo "Archivos preparados:"
          ls -lh build-output/

      - name: 12. Subir APK lista para instalar en cualquier Android
        uses: actions/upload-artifact@v4
        with:
          name: Seis6-App-APK
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 13. Resumen de compilación
        run: |
          echo "### 🎉 ¡APK Compilada con Éxito desde Vite!" >> $GITHUB_STEP_SUMMARY
          echo "- **Motor:** Vite + React + Capacitor Nativo" >> $GITHUB_STEP_SUMMARY
          echo "- **Diseño:** 100% AMOLED Dark (#000000) Edge-to-Edge" >> $GITHUB_STEP_SUMMARY
          echo "- **Base de Datos:** Firebase Firestore + Cloud Sync" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivos:** \`Seis6_App_v1.0.apk\` y \`Seis6_Vault_v1.0.apk\` disponibles para descarga en Artifacts." >> $GITHUB_STEP_SUMMARY
