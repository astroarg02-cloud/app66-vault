name: Generar APK de Android (Vite + Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android desde Vite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22 y Java JDK 21
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Compilar aplicación web e integrar en Capacitor (Sin depender de Vercel)
        run: |
          npm install --legacy-peer-deps
          npm run build
          mkdir -p cap-app
          cp -r dist cap-app/dist
          cd cap-app
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.seis6.app",
            "appName": "Seis6 App",
            "webDir": "dist",
            "server": {
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 4. Aplicar configuración AMOLED #000000 y correcciones Gradle
        run: |
          node scripts/configure-android.cjs

      - name: 5. Aceptar licencias y verificar Android SDK 35 (Android 15)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK ubicado en: $ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" 2>/dev/null || true

      - name: 6. Compilar APK Nativa con Gradle
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "cap-app/android" ]; then
            cd cap-app/android
          elif [ -d "android" ]; then
            cd android
          else
            echo "ERROR: Directorio android no encontrado."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 7. Preparar archivo APK final
        run: |
          mkdir -p build-output
          APK_FOUND=$(find cap-app/android/app/build/outputs/apk android/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find . -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_FOUND" ]; then
            echo "ERROR: No se encontró ningún archivo APK generado por Gradle."
            exit 1
          fi
          echo "APK encontrada en: $APK_FOUND"
          cp "$APK_FOUND" build-output/Seis6_App_v1.0.apk
          cp "$APK_FOUND" build-output/Seis6_Vault_v1.0.apk
          echo "Archivos preparados en build-output/:"
          ls -lh build-output/

      - name: 8. Subir APK lista para instalar en cualquier Android
        uses: actions/upload-artifact@v4
        with:
          name: Seis6-App-APK
          path: |
            build-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 9. Resumen de compilación
        run: |
          echo "### 🎉 ¡APK Compilada con Éxito desde Vite!" >> $GITHUB_STEP_SUMMARY
          echo "- **Motor:** Vite + React + Capacitor Nativo" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js:** v22" >> $GITHUB_STEP_SUMMARY
          echo "- **Java:** JDK 21" >> $GITHUB_STEP_SUMMARY
          echo "- **Android:** Compile/Target Android 15 (API 35), Min SDK 24" >> $GITHUB_STEP_SUMMARY
          echo "- **Diseño:** 100% AMOLED Dark (#000000) Edge-to-Edge" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivos:** \`Seis6_App_v1.0.apk\` y \`Seis6_Vault_v1.0.apk\` disponibles para descarga en Artifacts." >> $GITHUB_STEP_SUMMARY
