name: Generar APK Nativa de Android (Flutter)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Flutter (Diseño Nuevo Nativo)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Aceptar licencias de Android SDK
        run: |
          yes | flutter doctor --android-licenses || true

      - name: 5. Generar plataforma Android oficial y configurar permisos
        working-directory: ./flutter_app
        run: |
          echo "Generando plataforma Android oficial..."
          flutter create --platforms=android --org com.seis6 .

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>/' "$MANIFEST"
            fi
            sed -i 's/android:label="[^"]*"/android:label="Seis6 Vault"/' "$MANIFEST"
          fi

          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: 6. Instalar dependencias
        working-directory: ./flutter_app
        run: |
          flutter pub get

      - name: 7. Compilar APK Nativa Release
        working-directory: ./flutter_app
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: 8. Subir APK Nativa lista para instalar
        uses: actions/upload-artifact@v4
        with:
          name: Seis6-App-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 9. Resumen de compilación
        run: |
          echo "### 🎉 ¡APK Compilada con Éxito!" >> $GITHUB_STEP_SUMMARY
          echo "- **Motor:** 100% Flutter Nativo ARM64 (sin WebView)" >> $GITHUB_STEP_SUMMARY
          echo "- **Diseño:** Idéntico a Vite con Modo Oscuro AMOLED (#000000)" >> $GITHUB_STEP_SUMMARY
          echo "- **Base de Datos:** Firebase Firestore sincronizado" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivo:** \`app-release.apk\` disponible en la sección de Artifacts arriba." >> $GITHUB_STEP_SUMMARY
