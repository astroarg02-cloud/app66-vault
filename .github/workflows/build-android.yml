name: Generar APK de Android (Vite + Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android desde Vite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Instalar dependencias npm
        run: |
          npm install --legacy-peer-deps

      - name: 5. Compilar Frontend Web con Vite
        run: |
          npm run build

      - name: 6. Sincronizar plataforma Android con Capacitor
        run: |
          if [ ! -d "android" ]; then
            echo "Directorio android no encontrado, agregando plataforma Android..."
            npx cap add android
          else
            echo "Directorio android encontrado, sincronizando assets..."
            npx cap sync android
          fi

      - name: 7. Aplicar configuración AMOLED #000000 y correcciones Gradle
        run: |
          node scripts/configure-android.cjs

      - name: 8. Aceptar licencias y verificar Android SDK 34 (Android 14)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK ubicado en: $ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: 9. Compilar APK Nativa con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 10. Preparar archivo APK final
        run: |
          mkdir -p build-output
          APK_FOUND=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find android/ -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_FOUND" ]; then
            echo "ERROR: No se encontró ningún archivo APK generado por Gradle."
            exit 1
          fi
          echo "APK encontrada en: $APK_FOUND"
          cp "$APK_FOUND" build-output/Seis6_App_v1.0.apk
          cp "$APK_FOUND" build-output/Seis6_Vault_v1.0.apk
          echo "Archivos preparados en build-output/:"
          ls -lh build-output/

      - name: 11. Subir APK lista para instalar en cualquier Android
        uses: actions/upload-artifact@v4
        with:
          name: Seis6-App-APK
          path: |
            build-output/*.apk
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 12. Resumen de compilación
        run: |
          echo "### 🎉 ¡APK Compilada con Éxito desde Vite!" >> $GITHUB_STEP_SUMMARY
          echo "- **Motor:** Vite + React + Capacitor Nativo" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js:** v22" >> $GITHUB_STEP_SUMMARY
          echo "- **Java:** JDK 21" >> $GITHUB_STEP_SUMMARY
          echo "- **Android:** Target Android 14 (API 34) / Compile SDK 36" >> $GITHUB_STEP_SUMMARY
          echo "- **Diseño:** 100% AMOLED Dark (#000000) Edge-to-Edge" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivos:** \`Seis6_App_v1.0.apk\` y \`Seis6_Vault_v1.0.apk\` disponibles para descarga en Artifacts." >> $GITHUB_STEP_SUMMARY
