name: Generar APK de Flutter en la Nube
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --split-per-abi

      - name: Compilar APK Universal
        run: flutter build apk --release

      - name: Subir APKs compilados como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Vault-Private-Server-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
