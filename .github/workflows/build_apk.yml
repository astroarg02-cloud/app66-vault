name: Generar APK de Android (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22 (Requerido por Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Compilar aplicación web e integrar en Capacitor (Edge-to-Edge Sin Bordes Grises)
        run: |
          npm install
          npm run build
          mkdir -p cap-app
          cp -r dist cap-app/dist
          cd cap-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.seis6.app",
            "appName": "Seis6 App",
            "webDir": "dist",
            "backgroundColor": "#000000",
            "android": {
              "backgroundColor": "#000000",
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            },
            "server": {
              "cleartext": true,
              "androidScheme": "https"
            },
            "plugins": {
              "StatusBar": {
                "overlaysWebView": true,
                "style": "DARK",
                "backgroundColor": "#000000"
              }
            }
          }
          EOF
          npx cap add android
          npx cap sync android

          # 1. Configurar colors.xml en todos los directorios (Negro puro para evitar bandas grises)
          for dir in values values-night; do
            mkdir -p android/app/src/main/res/$dir
            cat << 'EOF' > android/app/src/main/res/$dir/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#0066FF</color>
          </resources>
          EOF
          done

          # 2. Configurar styles.xml base en values y values-night (Fuerza tema oscuro puro sin bordes)
          for dir in values values-night; do
            mkdir -p android/app/src/main/res/$dir
            cat << 'EOF' > android/app/src/main/res/$dir/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#000000</item>
                  <item name="colorPrimaryDark">#000000</item>
                  <item name="colorAccent">#0066FF</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:colorBackground">#000000</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">#000000</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:colorBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:windowLightStatusBar" tools:targetApi="m">false</item>
                  <item name="android:windowLightNavigationBar" tools:targetApi="o_mr1">false</item>
                  <item name="android:windowTranslucentStatus">false</item>
                  <item name="android:windowTranslucentNavigation">false</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">#000000</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF
          done

          # 3. Configurar cutout notch en Android 9+ (API 28+) para values-v28 y values-night-v28
          for dir in values-v28 values-night-v28; do
            mkdir -p android/app/src/main/res/$dir
            cat << 'EOF' > android/app/src/main/res/$dir/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">#000000</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:colorBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:windowTranslucentStatus">false</item>
                  <item name="android:windowTranslucentNavigation">false</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">#000000</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF
          done

          # 4. Configurar Android 10+ (API 29+) para remover el scrim gris forzado de la barra de navegación
          for dir in values-v29 values-night-v29 values-v31 values-night-v31; do
            mkdir -p android/app/src/main/res/$dir
            cat << 'EOF' > android/app/src/main/res/$dir/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">#000000</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:colorBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:enforceNavigationBarContrast" tools:targetApi="q">false</item>
                  <item name="android:enforceStatusBarContrast" tools:targetApi="q">false</item>
                  <item name="android:windowTranslucentStatus">false</item>
                  <item name="android:windowTranslucentNavigation">false</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">#000000</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:enforceNavigationBarContrast" tools:targetApi="q">false</item>
                  <item name="android:enforceStatusBarContrast" tools:targetApi="q">false</item>
              </style>
          </resources>
          EOF
          done

          # 5. Configurar MainActivity.java para forzar WebView negro, layout extendido y sin bordes grises
          cat << 'EOF' > android/app/src/main/java/com/seis6/app/MainActivity.java
          package com.seis6.app;

          import android.os.Bundle;
          import android.os.Build;
          import android.graphics.Color;
          import android.webkit.WebView;
          import android.view.WindowManager;
          import android.view.View;
          import android.view.Window;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applyEdgeToEdgeBlack();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  applyEdgeToEdgeBlack();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      applyEdgeToEdgeBlack();
                  }
              }

              private void applyEdgeToEdgeBlack() {
                  try {
                      Window window = getWindow();
                      if (window != null) {
                          window.setBackgroundDrawableResource(android.R.color.black);
                          if (window.getDecorView() != null) {
                              window.getDecorView().setBackgroundColor(Color.BLACK);
                          }
                          View contentView = window.findViewById(android.R.id.content);
                          if (contentView != null) {
                              contentView.setBackgroundColor(Color.BLACK);
                          }

                          window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                          window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_NAVIGATION);
                          window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);

                          window.setStatusBarColor(Color.BLACK);
                          window.setNavigationBarColor(Color.BLACK);

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                              WindowManager.LayoutParams lp = window.getAttributes();
                              lp.layoutInDisplayCutoutMode =
                                  WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                              window.setAttributes(lp);
                          }

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              window.setNavigationBarContrastEnforced(false);
                              window.setStatusBarContrastEnforced(false);
                          }

                          WindowCompat.setDecorFitsSystemWindows(window, false);

                          WindowInsetsControllerCompat controller = new WindowInsetsControllerCompat(window, window.getDecorView());
                          controller.setAppearanceLightStatusBars(false);
                          controller.setAppearanceLightNavigationBars(false);
                      }

                      WebView webView = getBridge() != null ? getBridge().getWebView() : null;
                      if (webView != null) {
                          webView.setBackgroundColor(Color.BLACK);
                          webView.setOverScrollMode(WebView.OVER_SCROLL_NEVER);
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

          # 6. Habilitar max_aspect y resizeableActivity en AndroidManifest.xml
          node -e "
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          if (fs.existsSync(p)) {
            let m = fs.readFileSync(p, 'utf8');
            if (!m.includes('android.max_aspect')) {
              m = m.replace('</application>', '    <meta-data android:name=\"android.max_aspect\" android:value=\"3.0\" />\n    </application>');
            }
            if (!m.includes('android:resizeableActivity')) {
              m = m.replace('<activity', '<activity android:resizeableActivity=\"true\" android:windowSoftInputMode=\"adjustResize\"');
              m = m.replace('<application', '<application android:resizeableActivity=\"true\"');
            }
            fs.writeFileSync(p, m);
          }
          "

      - name: 4. Configurar Java JDK 21 (Requerido por Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 5. Compilar archivo APK con Gradle
        working-directory: ./cap-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Seis6-App-APK
          path: cap-app/android/app/build/outputs/apk/debug/app-debug.apk
