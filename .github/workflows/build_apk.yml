name: Generar APK de Android (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22 (Requerido por Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Compilar aplicación web e integrar en Capacitor (Sin depender de Vercel)
        run: |
          npm install
          npm run build
          mkdir -p cap-app
          cp -r dist cap-app/dist
          cd cap-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.seis6.app",
            "appName": "Seis6 App",
            "webDir": "dist",
            "server": {
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: 4. Configurar Java JDK 21 (Requerido por Android Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 5. Compilar archivo APK con Gradle
        working-directory: ./cap-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Seis6-App-APK
          path: cap-app/android/app/build/outputs/apk/debug/app-debug.apk
